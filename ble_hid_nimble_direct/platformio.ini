; From-scratch BLE HID keyboard on NimBLE - NO t-vk/ESP32 BLE Keyboard library.
; Full control over the GATT/HID setup and, crucially, the pairing security.
;
; Two envs to A/B the pairing mode:
;   esp32c3_hid_raw      -> bonding, no MITM, LEGACY pairing (most compatible)
;   esp32c3_hid_raw_sc   -> bonding, no MITM, Secure Connections
[env:esp32c3_hid_raw]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags = -DSEC_BOND=1 -DSEC_MITM=0 -DSEC_SC=0
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2

[env:esp32c3_hid_raw_sc]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags = -DSEC_BOND=1 -DSEC_MITM=0 -DSEC_SC=1
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
