; Minimal ESP32-C3 BLE-HID isolation test.
; Two envs so we can A/B the BLE stack on the same board:
;   esp32c3_nimble    -> NimBLE stack (what v9 uses)
;   esp32c3_bluedroid -> Bluedroid stack (ESP32 core default)
[env:esp32c3_nimble]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags = -DUSE_NIMBLE
lib_deps =
    t-vk/ESP32 BLE Keyboard @ ^0.3.2
    h2zero/NimBLE-Arduino @ ^1.4.2

[env:esp32c3_bluedroid]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    t-vk/ESP32 BLE Keyboard @ ^0.3.2

; Same Bluedroid HID demo, but overrides the pairing mode to Secure Connections
; + bonding WITHOUT MITM (the library asks for MITM, which this display-less
; board cannot satisfy -> pairing abort / link loss).
[env:esp32c3_bluedroid_scbond]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags = -DSEC_SC_BOND
lib_deps =
    t-vk/ESP32 BLE Keyboard @ ^0.3.2

