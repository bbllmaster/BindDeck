[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv

lib_deps =
    t-vk/ESP32 BLE Keyboard @ ^0.3.2
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5
    thomasfredericks/Bounce2 @ ^2.71

[env:esp32dev_sh1106]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags = -DUSE_SH1106
lib_deps =
    t-vk/ESP32 BLE Keyboard @ ^0.3.2
    adafruit/Adafruit SH110X
    adafruit/Adafruit GFX Library @ ^1.11.5
    thomasfredericks/Bounce2 @ ^2.71

[env:esp32dev_sh1107]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags = -DUSE_SH1107
lib_deps =
    t-vk/ESP32 BLE Keyboard @ ^0.3.2
    adafruit/Adafruit SH110X
    adafruit/Adafruit GFX Library @ ^1.11.5
    thomasfredericks/Bounce2 @ ^2.71

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
; The C3 does NOT use the t-vk/ESP32 BLE Keyboard library: it cannot bring up a
; stable bonded+encrypted HID link on the C3 (the host drops the link during
; pairing, ~every 0.5s). src/nimble_hid.{h,cpp} implements the HID keyboard
; directly on NimBLE (bonding + legacy pairing, no MITM) and is used instead.
build_flags = -DUSE_SH1106 -DTARGET_ESP32C3
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
    adafruit/Adafruit SH110X
    adafruit/Adafruit GFX Library @ ^1.11.5
    thomasfredericks/Bounce2 @ ^2.71

[env:esp32c3_ssd1306]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
; The C3 does NOT use the t-vk/ESP32 BLE Keyboard library: it cannot bring up a
; stable bonded+encrypted HID link on the C3 (the host drops the link during
; pairing, ~every 0.5s). src/nimble_hid.{h,cpp} implements the HID keyboard
; directly on NimBLE (bonding + legacy pairing, no MITM) and is used instead.
build_flags = -DTARGET_ESP32C3
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5
    thomasfredericks/Bounce2 @ ^2.71
