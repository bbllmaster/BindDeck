[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
board_build.partitions = binddeck_ota_c3.csv
; ESP32-C3 compiles its PHY (RF) calibration data into the app (DROM), so it
; does NOT need a phy_init partition. (Classic ESP32 does - see binddeck_ota.csv.)
; All targets (classic ESP32 + C3) use src/nimble_hid.{h,cpp}, a NimBLE-based
; HID keyboard + CFG/CMD service. The t-vk/Bluedroid stack was ~570KB heavier
; and, on the C3, could not hold a stable bonded+encrypted HID link. NimBLE
; (bonding + legacy pairing, no MITM) is unified across both chips.
; Allow the OS HID link + the PC config app link to coexist (NimBLE defaults
; to 1 connection, so the app's CFG/BTN link used to be rejected/dropped while
; Windows held the HID link). Keep advertising while connected (keepAdvertising
; in main.cpp) so the app can discover it as a second central.
build_flags = -DUSE_SH1106 -DTARGET_ESP32C3 -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
    adafruit/Adafruit SH110X
    adafruit/Adafruit GFX Library @ ^1.11.5
    thomasfredericks/Bounce2 @ ^2.71

[env:esp32c3_ssd1306]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
board_build.partitions = binddeck_ota_c3.csv
; ESP32-C3 compiles its PHY (RF) calibration data into the app (DROM), so it
; does NOT need a phy_init partition. (Classic ESP32 does - see binddeck_ota.csv.)
; All targets (classic ESP32 + C3) use src/nimble_hid.{h,cpp}, a NimBLE-based
; HID keyboard + CFG/CMD service. The t-vk/Bluedroid stack was ~570KB heavier
; and, on the C3, could not hold a stable bonded+encrypted HID link. NimBLE
; (bonding + legacy pairing, no MITM) is unified across both chips.
; See esp32c3: allow HID + config-app links to coexist.
build_flags = -DTARGET_ESP32C3 -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5
    thomasfredericks/Bounce2 @ ^2.71
