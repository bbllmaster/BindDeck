[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
board_build.partitions = binddeck_ota.csv
; All targets (classic ESP32 + C3) use src/nimble_hid.{h,cpp}, a NimBLE-based
; HID keyboard + CFG/CMD service. The t-vk/Bluedroid stack was ~570KB heavier
; and, on the C3, could not hold a stable bonded+encrypted HID link. NimBLE
; (bonding + legacy pairing, no MITM) is unified across both chips.
build_flags = -DUSE_SH1106 -DTARGET_ESP32C3
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
    adafruit/Adafruit SH110X
    adafruit/Adafruit GFX Library @ ^1.11.5
    thomasfredericks/Bounce2 @ ^2.71

