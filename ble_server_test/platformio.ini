; Plain ESP32-C3 BLE peripheral, NO HID, no extra libraries.
; Isolates "C3 BLE stack / RF is unstable" from "the HID implementation is
; unstable": if this plain peripheral also flaps, the C3's BLE link itself
; is the problem; if it stays connected for minutes, the fault is HID-specific.
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
